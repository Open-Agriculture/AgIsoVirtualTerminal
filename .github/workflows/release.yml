name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  release_upload:
    name: Release Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Packages
        uses: actions/download-artifact@v7
      - name: Name Deb Packages By Ubuntu Version
        run: |
          for deb in Ubuntu*/*.deb; do
            version="${deb#Ubuntu }"
            mv "$deb" "$(basename "${deb%.deb}")-ubuntu-${version%% *}.deb"
          done
      - name: Zip vt-render
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          (cd "vt-render Windows" && zip -r "../vt-render-$TAG-windows-x64.zip" .)
          # Downloaded artifacts lose the executable bit
          chmod +x "vt-render Ubuntu 24.04/vt-render"
          (cd "vt-render Ubuntu 24.04" && zip -r "../vt-render-$TAG-linux-ubuntu-24.04-x64.zip" .)
      - name: Attach Packages To Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" "Windows Installer"/*.exe "OSX dmg package"/*.dmg *.deb vt-render-*.zip --clobber
