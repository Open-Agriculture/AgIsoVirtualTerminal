name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:

jobs:
  windows_build:
    name: Windows Build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: 'Install NSIS'
        uses: repolevedavaj/install-nsis@v1.2.1
        with:
            nsis-version: '3.12'
      - name: Compile
        uses: ./.github/actions/build-vt
        with:
          target: package
      - name: 'Upload Windows Installer'
        uses: actions/upload-artifact@v7
        with:
          name: 'Windows Installer'
          path: build/_CPack_Packages/win64/NSIS/*.exe
          if-no-files-found: error
  mac_build:
    name: MacOS Build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Compile
        uses: ./.github/actions/build-vt
        with:
          target: package
      - name: 'Upload OSX Installer'
        uses: actions/upload-artifact@v7
        with:
          name: 'OSX dmg package'
          path: build/*.dmg
          if-no-files-found: error
  ubuntu_22_04_build:
    name: Ubuntu 22.04 Build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype6-dev libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libwebkit2gtk-4.0-dev libglu1-mesa-dev mesa-common-dev
      - name: Compile
        uses: ./.github/actions/build-vt
      - name: Package
        working-directory: build
        run: cpack -G DEB
      - name: 'Upload Ubuntu 22.04 deb package'
        uses: actions/upload-artifact@v7
        with:
          name: 'Ubuntu 22.04 deb package'
          path: build/_CPack_Packages/Linux/DEB/*.deb
          if-no-files-found: error
  ubuntu_24_04_build:
    name: Ubuntu 24.04 Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
      - name: Compile
        uses: ./.github/actions/build-vt
      - name: Package
        working-directory: build
        run: cpack -G DEB
      - name: 'Upload Ubuntu 24.04 deb package'
        uses: actions/upload-artifact@v7
        with:
          name: 'Ubuntu 24.04 deb package'
          path: build/_CPack_Packages/Linux/DEB/*.deb
          if-no-files-found: error
  ubuntu_26_04_build:
    name: Ubuntu 26.04 Build
    runs-on: ubuntu-26.04
    # The ubuntu-26.04 runner is an amd64v3 install, so its toolchain marks every binary as needing x86-64-v3
    container: ubuntu:26.04
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential ca-certificates libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev git cmake
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-tags: true
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Trust the checkout
        # The container runs as root, but the checkout belongs to the runner user
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Compile
        uses: ./.github/actions/build-vt
      - name: Package
        working-directory: build
        run: cpack -G DEB
      - name: Check the binary runs on baseline x86-64
        run: |
          readelf -n build/_CPack_Packages/Linux/DEB/*/usr/bin/AgISOVirtualTerminal | tee notes.txt
          ! grep -E "x86 ISA needed:.*x86-64-v[234]" notes.txt
      - name: 'Upload Ubuntu 26.04 deb package'
        uses: actions/upload-artifact@v7
        with:
          name: 'Ubuntu 26.04 deb package'
          path: build/_CPack_Packages/Linux/DEB/*.deb
          if-no-files-found: error
